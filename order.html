<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"><div class="container site-header__bar">
  <a class="site-header__brand" href="index.html"><svg class="site-header__logo" viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="16" rx="8" ry="12.5" transform="rotate(35 16 16)" fill="#c89b53"/><path d="M9 24c8-4 6-12 14-16" stroke="#2b1810" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg><span>BeanCraft</span></a>
  <button class="nav__toggle" aria-expanded="false" aria-controls="nav">Menu</button>
  <nav class="nav" id="nav" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="product.html">Products</a>
    <a href="order.html" aria-current="page">Order<span class="nav__badge" id="cartCount" hidden>0</span></a>
  </nav>
</div></header>
<main id="main">
<section class="page-head"><div class="container"><h1>Your order</h1><p>Review your coffee, then tell us where to send it. You pay when it arrives.</p></div></section>
<section class="section"><div class="container" id="order-main">
  <div class="order__grid">
    <div class="panel">
      <h2>Order summary</h2>
      <div id="items" aria-live="polite"></div>
      <div class="totals">
        <div><span>Subtotal</span><span id="sub">Rs. 0</span></div>
        <div><span>Delivery</span><span id="ship">Rs. 0</span></div>
        <div class="totals__grand"><span>Total</span><span id="grand">Rs. 0</span></div>
        <p class="text-muted" id="hint"></p>
      </div>
    </div>
    <form class="panel" id="checkout" novalidate>
      <h2>Delivery details</h2>
      <div class="field"><label for="name">Full name</label><input id="name" name="name" aria-describedby="e-name" autocomplete="name" required><span class="field__error" aria-live="polite" id="e-name"></span></div>
      <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" aria-describedby="e-phone" type="tel" autocomplete="tel" placeholder="0300-1234567" required><span class="field__error" aria-live="polite" id="e-phone"></span></div>
      <div class="field"><label for="email">Email (optional)</label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" aria-describedby="e-email"><span class="field__error" aria-live="polite" id="e-email"></span></div>
      <div class="field"><label for="address">Delivery address</label><textarea id="address" name="address" aria-describedby="e-address" rows="3" autocomplete="street-address" required></textarea><span class="field__error" aria-live="polite" id="e-address"></span></div>
      <div class="field"><label for="notes">Notes for the roaster (optional)</label><input id="notes" name="notes"></div>
      <button class="btn" type="submit">Place order</button>
    </form>
  </div>
</div></section>
</main>
<footer class="site-footer"><div class="container"><b>BeanCraft Artisan Roastery</b><br>Handcrafted coffee, delivered fresh. &copy; 2026</div></footer>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
